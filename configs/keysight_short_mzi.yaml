# keysight.yaml for a short fibre MZI: ~5 m path difference (4-7 m), FSR ~41 MHz.
# The 62 m MZI (FSR 3.3 MHz) fringes at 318-427 kHz, far above this scope's
# 91 kHz Nyquist at 2 Mpts over 11 s, so its phase is aliased. 5 m scales that to
# ~25-34 kHz, >= 5 samples per fringe. Check the first scan with
# `spectro plot --phase`: fringe rate ~25-34 kHz, no "steps backwards" warning.
# Sweep is always continuous + oneway; that is hardcoded in acquire.py.

scope:
  driver: dsox4024a         # dho4204 (default) | dsox4024a
  resource: "USB0::0x0957::0x17A6::MY55440446::INSTR"  # set to your scope's; rm.list_resources()
  duration_s: 11.0          # capture window: 0.5 s pretrigger + 10 s sweep + 0.5 s margin.
                            # Was 20 s, which spent half the record on flyback
  points: 2_000_000         # per channel; sample rate = points / duration_s (here 182 kS/s)
  memory_depth: 4_000_000   # :ACQuire:POINts, total; split to 2 Mpts/ch with all four on
  trigger:                  # edge on channels.trigger (laser sweep-start TTL), NORMal sweep
    level_v: 2.0
    slope: POSitive         # POSitive | NEGative
  channels:                 # role -> physical channel + vertical setup
    mzi:     {ch: 1, scale: 1.00, offset: 3.50}
    gascell: {ch: 2, scale: 0.50, offset: 4.50}
    dut:     {ch: 3, scale: 0.50, offset: 1.50}
    trigger: {ch: 4, scale: 5.00, offset: 0.00}

laser:
  resource: "GPIB0::21::INSTR"
  slot: 0
  channel: 1
  start_nm: 1500.0
  stop_nm: 1600.0
  cycles: 0
  speed_nm_s: 10.0
  power: 12.0
  power_unit: "dBm"         # dBm | mW | uW | nW
  output_path: "high"       # high | lowsse | both_high | both_low

process:
  # Every knob the analysis takes, so a run folder records the numbers and not
  # just the hardware settings. Defaults here are what the code used to carry
  # in its signatures; a file written before this section existed still loads,
  # the functions fall back to the same values.
  #
  # These are chosen *after* the capture, unlike the sections above. To
  # re-analyse a run, edit this block in the run folder's config.yaml and rerun
  # `spectro fit` / `spectro d2`: it beats the copy frozen into scan.h5. What a
  # fit actually used is recorded in the ruler/sweep_<n> group of the file.

  # Step 2: MZI phase. Band-pass applied before the Hilbert transform, and not
  # optional -- without it the unwrapped phase goes non-monotonic, because
  # low-frequency intensity drift drags the analytic signal off the origin and
  # the phase then stops winding one way. Three accepted forms:
  #   [low, high]  explicit Hz edges
  #   auto         measure the fringe rate and derive the band (see below)
  #   null         no filtering at all
  # Exponents need the sign (2.0e+5, not 2.0e5): YAML 1.1 parses the unsigned
  # form as a string, and preflight rejects it.
  bandpass_hz: auto

  # How `auto` measures: a spectrogram of the *raw* MZI trace, strongest bin per
  # segment. Raw on purpose -- the fringe rate read off the unwrapped phase is
  # circular, since whatever the band-pass left is all there is left to measure,
  # so it reports a rate inside the band however wrong the band is.
  fringe_rate:
    nperseg: 4096             # samples per segment: 23 ms at 182 kS/s, giving
                              # 44 Hz resolution; short enough to follow the ~30%
                              # sweep-speed change across the scan
    search_hz: [1.0e+4, 9.0e+4]
                              # where the fringe is looked for. The low edge is
                              # what keeps the peak off the intensity drift near
                              # DC, which is far stronger than the fringe itself
    margin: 0.25              # band = measured range widened by this fraction,
                              # then capped below the second harmonic of the
                              # slowest fringe, and below Nyquist
    pctile: 1.0               # percentile taken as the measured range instead of
                              # min/max, so one segment that latched onto noise
                              # cannot set an edge of the band by itself

  # Cutting the record into forward sweeps.
  sweeps:
    trigger_threshold: null   # null = midpoint of the trigger trace

  # Step 3: gas-cell anchors.
  anchors:
    resolution_pm: 1.0        # wavelength per sample after decimation; matches
                              # the catalogue's own ~0.7 pm accuracy, finer
                              # only buys noise
    snr: 20.0                 # dip threshold, in multiples of trace noise
    tol_nm: 0.1               # largest nominal-vs-catalogue disagreement taken
                              # as a match; the dial is good to ~20 pm and the
                              # lines are ~400 pm apart
    n_mad: 5.0                # second pass: robust sigma from the residual
                              # cluster beyond which a match was coincidence

  # Step 4: the nu(phi) fit.
  ruler:
    degree: 2                 # 3-4 buy nothing over a quadratic: measured
                              # 88.9-89.6 MHz RMS vs 90.2, the catalogue's own
                              # accuracy
    max_j: 20                 # drop max_j_species lines above this |J|
    max_j_species: "H12C14N"  # only this catalogue's error doubles with |J|
                              # (SRM 2519a cross-check); null disables the cut
    slip_frac: 0.5            # phase slip = fringe rate off its local median by
                              # this fraction (contrast fade, laser glitch); each
                              # one gets a free step in nu(phi). null disables

  # Step 5: the DUT on an absolute frequency axis.
  spectrum:
    trim_frac: 0.02           # discarded from each end before interpolating,
                              # to drop the Hilbert transform's edge artefacts
    n_points: null            # output grid size; null = the sweep's own count

  # Step 5b: clean the DUT trace before resonances are looked for. Runs inside
  # dut_spectrum, so every command that reads a DUT spectrum (plot --resonances,
  # d2, the heater scripts) uses it. Set a knob to null to switch that part off.
  clean:
    avg_hz: 1.0e+7            # average raw samples in blocks this wide in optical
                              # frequency, before resampling. At 0.5 MHz/sample
                              # that is 20 samples (noise down sqrt(20) ~ 4.5x),
                              # still 20 points across a 200 MHz FWHM
    baseline_ghz: 10.0        # divide by a rolling baseline over this window:
                              # far wider than a resonance, far narrower than the
                              # ~3 THz wander from laser power / coupler / polarisation
    baseline_pctile: 90.0     # high percentile so dips don't pull the baseline
                              # down; use ~10 if the resonances are peaks

  # Step 6: resonance fits.
  resonances:
    expected_fwhm_hz: 2.0e+8  # order of magnitude only, the real linewidth
                              # comes out of the fit. 200 MHz matches the
                              # 20260813 ring (185-266 MHz over 125 modes)
    snr: 50.0                # much higher than anchors.snr: this ring's
                              # resonances stand ~400x the sample noise, so a
                              # low threshold finds noise inside their wings
    window_fwhm: 4.0          # fit half-window = this many expected FWHM ...
    window_gap_frac: 0.4      # ... capped at this fraction of the distance to
                              # the nearest other candidate, so one fit never
                              # eats a neighbour's wing

  # Dispersion (scripts/calc_d2.py).
  dispersion:
    ref_nm: 1550.0            # wavelength of mode mu = 0
    degree: 3
    n_mad: 3.0                # fit-residual rejection; the rejects are the
                              # avoided-mode-crossing candidates
    max_iter: 5               # rejection rounds
    amp_n_mad: 5.0            # low-amplitude fit-failure rejection, before
                              # mode numbers are assigned
    amx_floor_hz: 30.0e+6  # 150 MHz absolute floor

gascell:
  # Wavelength References tri-gas cell, 80 cm multi-pass (H(80) housing).
  # NIST-traceable vacuum centre wavelengths in nm, transcribed from the
  # per-species datasheets. Branch labels (R/P + rotational quantum number)
  # are kept so a fit can report which line it anchored on.
  #
  # Only lines inside laser.start_nm..stop_nm are usable -- see
  # config.gas_lines_nm(). The 1500-1600 nm sweep above reaches every line
  # in the cell.
  model: "Tri-H(80)-5/150/150"
  species:

    # The 5 Torr slot of the tri mix. A H13CN datasheet was supplied with the
    # cell, but the model number and the 5 Torr fill both point to H12CN, and
    # H13CN's 25 Torr table is the single-gas product. Confirm on the first
    # scan: only H12C14N has lines below 1527 nm.
    H12C14N:
      # Sasada & Yamada 1990, Table VI, (2 0^0 0)-(0 0^0 0) band, converted
      # from vacuum wavenumbers. Calculated from fitted molecular constants,
      # not measured line-by-line: benchmarking the paper's H13C14N column
      # against the 54 certified SRM 2519a wavelengths gives 0.38 pm RMS and
      # 0.71 pm worst case, the error growing with |J|. Treat the low-|J|
      # lines as the trustworthy anchors.
      pressure_torr: 5
      accuracy_pm: 0.7        # empirical, from the H13C14N cross-check above
      linewidth_pm: 16
      lines_nm:
        {P1:   1534.52984, P2:   1535.23629, P3:   1535.95333, P4:   1536.68095,
         P5:   1537.41922, P6:   1538.16813, P7:   1538.92767, P8:   1539.69784,
         P9:   1540.47871, P10:  1541.27025, P11:  1542.07248, P12:  1542.88542,
         P13:  1543.70908, P14:  1544.54348, P15:  1545.38859, P16:  1546.24448,
         P17:  1547.11115, P18:  1547.98860, P19:  1548.87683, P20:  1549.77590,
         P21:  1550.68579, P22:  1551.60651, P23:  1552.53809, P24:  1553.48054,
         P25:  1554.43387, P26:  1555.39810, P27:  1556.37324, P28:  1557.35930,
         P29:  1558.35631, P30:  1559.36426, P31:  1560.38319, P32:  1561.41313,
         P33:  1562.45405, P34:  1563.50599, P35:  1564.56897, P36:  1565.64298,
         P37:  1566.72806, P38:  1567.82423, P39:  1568.93149, P40:  1570.04985,
         R0:   1533.14868, R1:   1532.47395, R2:   1531.80978, R3:   1531.15613,
         R4:   1530.51304, R5:   1529.88044, R6:   1529.25834, R7:   1528.64676,
         R8:   1528.04565, R9:   1527.45500, R10:  1526.87484, R11:  1526.30513,
         R12:  1525.74586, R13:  1525.19702, R14:  1524.65859, R15:  1524.13061,
         R16:  1523.61302, R17:  1523.10582, R18:  1522.60902, R19:  1522.12261,
         R20:  1521.64655, R21:  1521.18088, R22:  1520.72553, R23:  1520.28055,
         R24:  1519.84590, R25:  1519.42157, R26:  1519.00758, R27:  1518.60390,
         R28:  1518.21050, R29:  1517.82744, R30:  1517.45464, R31:  1517.09215,
         R32:  1516.73993, R33:  1516.39797, R34:  1516.06628, R35:  1515.74486,
         R36:  1515.43368, R37:  1515.13276, R38:  1514.84205, R39:  1514.56162,
         R40:  1514.29137}

    12CO:
      # Datasheet table is the 500 Torr single-gas cell; a tri-gas cell runs
      # 150 Torr, so expect a sub-pm pressure shift on top of accuracy_pm.
      pressure_torr: 150
      accuracy_pm: 0.3        # expanded (2 sigma), at 500 Torr
      linewidth_pm: 17
      lines_nm:
        {R21: 1560.5013, R20: 1560.8668, R19: 1561.2588, R18: 1561.6775,
         R17: 1562.1226, R16: 1562.5943, R15: 1563.0925, R14: 1563.6173,
         R13: 1564.1687, R12: 1564.7467, R11: 1565.3513, R10: 1565.9825,
         R9:  1566.6404, R8:  1567.3251, R7:  1568.0365, R6:  1568.7747,
         R5:  1569.5396, R4:  1570.3314, R3:  1571.1501, R2:  1571.9957,
         R1:  1572.8684, R0:  1573.7681,
         P1:  1575.6491, P2:  1576.6303, P3:  1577.6389, P4:  1578.6749,
         P5:  1579.7382, P6:  1580.8290, P7:  1581.9475, P8:  1583.0934,
         P9:  1584.2672, P10: 1585.4687, P11: 1586.6982, P12: 1587.9555,
         P13: 1589.2410, P14: 1590.5547, P15: 1591.8966, P16: 1593.2669,
         P17: 1594.6657, P18: 1596.0930, P19: 1597.5489}

    13CO:
      # As above: table is 500 Torr, cell is 150 Torr.
      pressure_torr: 150
      accuracy_pm: 0.3
      linewidth_pm: 17
      lines_nm:
        {R21: 1595.3759, R20: 1595.7541, R19: 1596.1582, R18: 1596.5883,
         R17: 1597.0442, R16: 1597.5260, R15: 1598.0338, R14: 1598.5675,
         R13: 1599.1273, R12: 1599.7130, R11: 1600.3248, R10: 1600.9626,
         R9:  1601.6264, R8:  1602.3164, R7:  1603.0324, R6:  1603.7746,
         R5:  1604.5630, R4:  1605.3376, R3:  1606.1585, R2:  1607.0056,
         R1:  1607.8792, R0:  1608.7792,
         P1:  1610.6589, P2:  1611.6385, P3:  1612.6449, P4:  1613.6779,
         P5:  1614.7378, P6:  1615.8245, P7:  1616.9381, P8:  1618.0786,
         P9:  1619.2462, P10: 1620.4408, P11: 1621.6629, P12: 1622.9120,
         P13: 1624.1886, P14: 1625.4928, P15: 1626.8245, P16: 1628.1838,
         P17: 1629.5910, P18: 1630.9860, P19: 1632.4289}

heater:
  driver: voltage_ctrl                 # dg952 | voltage_ctrl; only that driver's block is read
  dg952:
    resource: "USB0::0x1AB1::0x0643::DG9A252400191::0::INSTR"
    channel: 2                  # output channel (1 or 2)
  voltage_ctrl:                 # Arduino 12-bit DAC supply (github.com/bongkokwei/voltage-ctrl)
    com_port: "COM3"            # "/dev/ttyUSB0" on Linux
    baud_rate: 9600
    channel: 32                  # DAC channel wired to the heater
    v_max: 10.0                 # hard clamp; current limit = 1.1 * V / load_ohm
  load_ohm: 6                  # heater resistance: DG952 load setting, voltage_ctrl current limit, aux_track power
  start_v: 0.0
  stop_v: 10.0
  steps: 101                     # voltage points (linspace), ~100 mV per step
  settle_s: 2.0                 # wait after setting voltage before acquiring
  window_ghz: 600.0              # frequency window around the target resonance
  target_thz: 193.41           # ≈ 1580 nm; nearest resonance in the cold scan
  save_all_scans: true         # true keeps every per-step scan.h5 (~1 GB each)

run:
  dir: "data"
  # dut_name: "aux_ring_2"
  dut_name: "ring_pm_short"
  notes: ""
