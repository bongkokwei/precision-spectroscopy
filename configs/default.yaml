      pressure_torr: 150
      accuracy_pm: 0.3
      linewidth_pm: 17
      lines_nm:
        {R21: 1595.3759, R20: 1595.7541, R19: 1596.1582, R18: 1596.5883,
         R17: 1597.0442, R16: 1597.5260, R15: 1598.0338, R14: 1598.5675,
